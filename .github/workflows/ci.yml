name: release-ci

on:
  push:
    branches: [main, release/v1.0.0]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test dependencies
        run: python -m pip install --disable-pip-version-check numpy jsonschema requests pypinyin
      - name: Repository and schema validation
        run: python scripts/validate_repository.py
      - name: Build and C# tests
        shell: powershell
        run: ./scripts/Build-Windows.ps1 -Configuration Release
      - name: No production private keys
        shell: powershell
        run: |
          $hits = Get-ChildItem -Recurse -File | Where-Object { $_.FullName -notmatch '\.git|bin|obj|retained|history' } | Select-String -Pattern 'BEGIN (EC |RSA )?PRIVATE KEY'
          if ($hits) { $hits | Out-Host; throw 'Private key material detected' }

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          # The versioned installer URL is a post-acceptance deployment gate and is intentionally
          # unavailable while this release PR is under review. All other public links are checked here.
          args: --no-progress --exclude-path docs/history --exclude-path retained --exclude 'https://lixinchen.ca/docs/mlccs-video-search/1.0.0/MLCCS-VideoSearch-Online-Setup-1.0.0.exe' README.md README_EN.md CHANGELOG.md SECURITY.md CONTRIBUTING.md SUPPORT.md
          fail: true
